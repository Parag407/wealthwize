<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthWize | Analytics</title>
    <meta name="description" content="Deep analytics and insights for your portfolio">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-shell" id="app-shell"></div>
    <script src="app.js"></script>
    <script src="components.js"></script>
    <script>
    document.getElementById('app-shell').innerHTML =
        getSidebarHTML() +
        '<main class="main-content">' +
            getTopBarHTML('Analytics', 'Deep insights into your investment strategy') +
            '<div class="bento-grid" id="bento-grid"></div>' +
        '</main>' +
        getFooterHTML() +
        getProfileModalHTML();

    function build() {
        const pv = getPortfolioValue(), pi = getPortfolioInvested(), pr = pv - pi;
        const sectors = getSectorAllocation();
        const sColors = ['#D4AF37','#10B981','#818CF8','#F59E0B','#EF4444','#06B6D4'];
        const details = state.portfolio.map(item => {
            const m = getStockMeta(item.symbol);
            const inv = item.qty*item.avgCost, cur = item.qty*m.ltp, ret = cur-inv;
            return { ...item, ...m, inv, cur, ret, pct: inv>0?((ret/inv)*100).toFixed(1):0 };
        });
        const winners = details.filter(d => d.ret>=0).length;
        const losers = details.filter(d => d.ret<0).length;
        const avgReturn = details.length>0 ? (details.reduce((s,d)=>s+parseFloat(d.pct),0)/details.length).toFixed(1) : 0;
        const bestDay = '+$2,840.50';
        const worstDay = '-$1,120.30';

        document.getElementById('bento-grid').innerHTML = `
        <!-- KPI Row -->
        <div class="bento-card kpi-card" style="grid-column:span 3;grid-row:span 2;">
            <div class="card-inner" style="justify-content:center;align-items:center;text-align:center;">
                <div class="stat-icon" style="background:rgba(212,175,55,0.1);color:var(--gold);margin-bottom:10px;"><i class="fas fa-trophy"></i></div>
                <p class="card-label">Win Rate</p>
                <h3 class="card-value" style="font-size:28px;color:var(--emerald);">${details.length>0?((winners/details.length)*100).toFixed(0):0}%</h3>
                <p style="font-size:10px;color:var(--text-muted);margin-top:4px;">${winners}W / ${losers}L</p>
            </div>
        </div>
        <div class="bento-card kpi-card" style="grid-column:span 3;grid-row:span 2;">
            <div class="card-inner" style="justify-content:center;align-items:center;text-align:center;">
                <div class="stat-icon" style="background:rgba(16,185,129,0.1);color:var(--emerald);margin-bottom:10px;"><i class="fas fa-chart-line"></i></div>
                <p class="card-label">Avg Return</p>
                <h3 class="card-value" style="font-size:28px;">${avgReturn}%</h3>
                <p style="font-size:10px;color:var(--text-muted);margin-top:4px;">Per holding</p>
            </div>
        </div>
        <div class="bento-card kpi-card" style="grid-column:span 3;grid-row:span 2;">
            <div class="card-inner" style="justify-content:center;align-items:center;text-align:center;">
                <div class="stat-icon" style="background:rgba(16,185,129,0.1);color:var(--emerald);margin-bottom:10px;"><i class="fas fa-sun"></i></div>
                <p class="card-label">Best Day</p>
                <h3 class="card-value" style="font-size:24px;color:var(--emerald);">${bestDay}</h3>
            </div>
        </div>
        <div class="bento-card kpi-card" style="grid-column:span 3;grid-row:span 2;">
            <div class="card-inner" style="justify-content:center;align-items:center;text-align:center;">
                <div class="stat-icon" style="background:rgba(239,68,68,0.1);color:var(--red);margin-bottom:10px;"><i class="fas fa-cloud-rain"></i></div>
                <p class="card-label">Worst Day</p>
                <h3 class="card-value" style="font-size:24px;color:var(--red);">${worstDay}</h3>
            </div>
        </div>

        <!-- Monthly Returns Heatmap -->
        <div class="bento-card" style="grid-column:span 8;grid-row:span 3;">
            <div class="card-inner">
                <p class="card-label">Monthly Returns (%)</p>
                <div style="flex:1;min-height:220px;"><canvas id="monthlyChart"></canvas></div>
            </div>
        </div>

        <!-- Risk Meter -->
        <div class="bento-card" style="grid-column:span 4;grid-row:span 3;">
            <div class="card-inner" style="align-items:center;justify-content:center;text-align:center;">
                <p class="card-label">Risk Score</p>
                <div style="position:relative;width:140px;height:140px;margin:12px 0;"><canvas id="riskGauge"></canvas>
                    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;">
                        <span style="font-size:32px;font-weight:800;color:var(--gold);">62</span>
                        <span style="font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Moderate</span>
                    </div>
                </div>
                <p style="font-size:11px;color:var(--text-muted);max-width:200px;line-height:1.6;">Your portfolio has a moderate risk profile. Consider diversifying across more sectors.</p>
            </div>
        </div>

        <!-- Correlation / Sector Bar -->
        <div class="bento-card" style="grid-column:span 6;grid-row:span 3;">
            <div class="card-inner">
                <p class="card-label">Sector Performance</p>
                <div style="flex:1;"><canvas id="sectorBarChart"></canvas></div>
            </div>
        </div>

        <!-- P&L Waterfall -->
        <div class="bento-card" style="grid-column:span 6;grid-row:span 3;">
            <div class="card-inner">
                <p class="card-label">P&L by Asset</p>
                <div style="flex:1;"><canvas id="plChart"></canvas></div>
            </div>
        </div>

        <!-- Diversification Score -->
        <div class="bento-card" style="grid-column:span 4;grid-row:span 2;">
            <div class="card-inner">
                <p class="card-label">Diversification Score</p>
                <div style="display:flex;align-items:center;gap:20px;margin-top:12px;">
                    <div style="position:relative;width:80px;height:80px;"><canvas id="divScore"></canvas>
                        <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--emerald);">72</span>
                    </div>
                    <div>
                        <p style="font-size:12px;font-weight:700;margin-bottom:4px;">Good</p>
                        <p style="font-size:10px;color:var(--text-muted);line-height:1.5;">Spread across ${Object.keys(sectors).length} sectors with ${state.portfolio.length} positions.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Volatility -->
        <div class="bento-card" style="grid-column:span 4;grid-row:span 2;">
            <div class="card-inner">
                <p class="card-label">Portfolio Volatility</p>
                <h3 class="card-value" style="font-size:24px;margin-top:8px;">18.4%</h3>
                <div class="alloc-bar" style="margin-top:12px;"><div class="alloc-bar-fill" style="width:18.4%;background:var(--gold);"></div></div>
                <p style="font-size:10px;color:var(--text-muted);margin-top:8px;">Annualized standard deviation of returns</p>
            </div>
        </div>

        <!-- Sharpe Ratio -->
        <div class="bento-card" style="grid-column:span 4;grid-row:span 2;">
            <div class="card-inner">
                <p class="card-label">Sharpe Ratio</p>
                <h3 class="card-value" style="font-size:24px;margin-top:8px;color:var(--emerald);">1.84</h3>
                <span class="tag-green" style="margin-top:8px;">Above Average</span>
                <p style="font-size:10px;color:var(--text-muted);margin-top:8px;">Risk-adjusted return metric</p>
            </div>
        </div>
        
        <!-- Advanced Market Scanner -->
        <div class="bento-card" style="grid-column:span 12;grid-row:span 3;">
            <div class="card-inner">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <p class="card-label" style="margin:0;">Advanced Market Scanner</p>
                    <span style="font-size:10px;font-weight:700;color:var(--text-muted);"><i class="fas fa-satellite-dish" style="color:var(--gold);margin-right:4px;"></i> LIVE</span>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                    <div>
                        <p style="font-size:11px;font-weight:800;color:var(--emerald);margin-bottom:12px;text-transform:uppercase;"><i class="fas fa-arrow-trend-up"></i> Top Gainers</p>
                        <div id="scanner-gainers"></div>
                    </div>
                    <div>
                        <p style="font-size:11px;font-weight:800;color:var(--red);margin-bottom:12px;text-transform:uppercase;"><i class="fas fa-arrow-trend-down"></i> Top Losers</p>
                        <div id="scanner-losers"></div>
                    </div>
                </div>
            </div>
        </div>`;

        initCharts(details, sectors, sColors);
    }

    function initCharts(details, sectors, sColors) {
        renderMarketScanner();
        // Monthly Returns Bar
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const monthData = months.map(() => (Math.random()*12-4).toFixed(1));
        new Chart(document.getElementById('monthlyChart').getContext('2d'), {
            type:'bar',
            data:{labels:months,datasets:[{data:monthData,backgroundColor:monthData.map(v=>v>=0?COLORS.emerald+'99':COLORS.red+'99'),borderRadius:6,barThickness:24}]},
            options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#475569',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#475569',font:{size:10},callback:v=>v+'%'}}}}
        });

        // Risk Gauge
        new Chart(document.getElementById('riskGauge').getContext('2d'), {
            type:'doughnut',
            data:{datasets:[{data:[62,38],backgroundColor:[COLORS.gold,'rgba(255,255,255,0.05)'],borderWidth:0}]},
            options:{responsive:true,maintainAspectRatio:true,cutout:'80%',rotation:-90,circumference:180,plugins:{legend:{display:false}}}
        });

        // Sector Bar
        new Chart(document.getElementById('sectorBarChart').getContext('2d'), {
            type:'bar',
            data:{labels:sectors.map(s=>s.name),datasets:[{data:sectors.map(()=>(Math.random()*30-5).toFixed(1)),backgroundColor:sColors.slice(0,sectors.length),borderRadius:8,barThickness:32}]},
            options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#475569',font:{size:10},callback:v=>v+'%'}},y:{grid:{display:false},ticks:{color:'#94A3B8',font:{size:11,weight:600}}}}}
        });

        // P&L Chart
        new Chart(document.getElementById('plChart').getContext('2d'), {
            type:'bar',
            data:{labels:details.map(d=>d.symbol),datasets:[{data:details.map(d=>d.ret),backgroundColor:details.map(d=>d.ret>=0?COLORS.emerald+'99':COLORS.red+'99'),borderRadius:6,barThickness:28}]},
            options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#94A3B8',font:{size:11}}},y:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#475569',font:{size:10},callback:v=>'$'+v.toLocaleString()}}}}
        });

        // Diversification
        new Chart(document.getElementById('divScore').getContext('2d'), {
            type:'doughnut',
            data:{datasets:[{data:[72,28],backgroundColor:[COLORS.emerald,'rgba(255,255,255,0.05)'],borderWidth:0}]},
            options:{responsive:true,cutout:'78%',plugins:{legend:{display:false}}}
        });
    }

    function renderMarketScanner() {
        const movers = getMarketMovers();
        const renderRow = (s, isGainer) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(255,255,255,0.02);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='rgba(255,255,255,0.02)'" onclick="openAssetModal('${s.symbol}')">
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="stock-badge" style="width:36px;height:36px;font-size:11px;">${s.symbol}</div>
                <div><p style="font-size:13px;font-weight:700;">${s.name}</p><p style="font-size:9px;color:var(--text-muted);">${s.sector} • RSI: ${s.rsi}</p></div>
            </div>
            <div style="text-align:right;">
                <p style="font-size:14px;font-weight:800;" id="ltp-${s.symbol}">${formatCurrency(s.ltp)}</p>
                <p style="font-size:11px;font-weight:700;color:${isGainer?'var(--emerald)':'var(--red)'};">${isGainer?'+':''}${((s.change/(s.ltp-s.change))*100).toFixed(2)}%</p>
            </div>
        </div>`;

        document.getElementById('scanner-gainers').innerHTML = movers.gainers.map(s => renderRow(s, true)).join('');
        document.getElementById('scanner-losers').innerHTML = movers.losers.map(s => renderRow(s, false)).join('');
    }

    initApp(); build();
    </script>
    <style>
        @media (max-width:1024px) { .bento-grid > * { grid-column:span 6!important; } }
        @media (max-width:768px) { 
            .bento-grid { grid-template-columns: repeat(2, 1fr) !important; }
            .bento-grid > * { grid-column:span 2!important; } 
            .bento-grid > .kpi-card { grid-column:span 1!important; }
        }
    </style>
</body>
</html>
