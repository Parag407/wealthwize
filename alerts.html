<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthWize | Alerts</title>
    <meta name="description" content="Set price alerts for your tracked instruments">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-shell" id="app-shell"></div>

    <div id="add-alert-modal" class="modal-overlay" style="opacity:0;transition:opacity 0.3s">
        <div class="modal-box" style="transform:scale(0.95);transition:transform 0.3s">
            <div class="modal-header"><h3>Create Alert</h3><button class="modal-close" onclick="closeModal('add-alert-modal')"><i class="fas fa-times"></i></button></div>
            <div class="form-group" style="position:relative;">
                <label class="form-label">Stock Symbol</label>
                <input type="text" id="alert-symbol" class="form-input" placeholder="e.g. NVDA" autocomplete="off">
                <div id="alert-suggestions" class="suggestions-dropdown custom-scrollbar"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                <div class="form-group">
                    <label class="form-label">Condition</label>
                    <select id="alert-condition" class="form-input" style="appearance:auto;">
                        <option value="above">Price Above</option>
                        <option value="below">Price Below</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Target Price</label>
                    <input type="number" id="alert-price" class="form-input" placeholder="0.00">
                </div>
            </div>
            <button id="save-alert-btn" class="btn-gold" style="width:100%;justify-content:center;padding:14px;" onclick="saveAlert()">CREATE ALERT</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="components.js"></script>
    <script>
    let selectedAlertSymbol = null;

    document.getElementById('app-shell').innerHTML =
        getSidebarHTML() +
        '<main class="main-content">' +
            getTopBarHTML('Price Alerts', 'Get notified on price movements') +
            '<div style="display:flex;justify-content:flex-end;margin-bottom:20px;">' +
                '<button class="btn-gold" onclick="selectedAlertSymbol=null;document.getElementById(\'alert-symbol\').value=\'\';document.getElementById(\'alert-price\').value=\'\';openModal(\'add-alert-modal\')"><i class="fas fa-plus"></i> NEW ALERT</button>' +
            '</div>' +
            '<div class="bento-grid" id="bento-grid"></div>' +
        '</main>' +
        getFooterHTML() +
        getProfileModalHTML();

    function build() {
        const active = state.alerts.filter(a=>a.active).length;
        const triggered = state.alerts.filter(a=>!a.active).length;

        document.getElementById('bento-grid').innerHTML = `
        <div class="bento-card kpi-card" style="grid-column:span 6;grid-row:span 2;">
            <div class="card-inner" style="justify-content:center;align-items:center;text-align:center;">
                <div class="stat-icon" style="background:rgba(212,175,55,0.1);color:var(--gold);margin-bottom:10px;"><i class="fas fa-bell"></i></div>
                <p class="card-label">Active Alerts</p>
                <h3 class="card-value gold-gradient" style="font-size:32px;">${active}</h3>
            </div>
        </div>
        <div class="bento-card kpi-card" style="grid-column:span 6;grid-row:span 2;">
            <div class="card-inner" style="justify-content:center;align-items:center;text-align:center;">
                <div class="stat-icon" style="background:rgba(16,185,129,0.1);color:var(--emerald);margin-bottom:10px;"><i class="fas fa-check-circle"></i></div>
                <p class="card-label">Triggered</p>
                <h3 class="card-value" style="font-size:32px;color:var(--emerald);">${triggered}</h3>
            </div>
        </div>

        <div class="bento-card" style="grid-column:span 12;grid-row:span 5;">
            <div class="card-inner">
                <h3 style="font-size:16px;font-weight:800;margin-bottom:20px;">All Alerts</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;" id="alerts-grid"></div>
            </div>
        </div>`;

        renderAlerts();
    }

    function renderAlerts() {
        document.getElementById('alerts-grid').innerHTML = state.alerts.map((a, i) => {
            const m = getStockMeta(a.symbol);
            const isTriggered = a.condition==='above' ? m.ltp>=a.price : m.ltp<=a.price;
            return `
            <div style="background:var(--glass);border:1px solid ${a.active?'var(--glass-border)':'rgba(16,185,129,0.3)'};border-radius:16px;padding:20px;transition:all 0.3s;${!a.active?'opacity:0.6;':''}">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div class="stock-badge">${a.symbol}</div>
                        <div><p style="font-size:14px;font-weight:700;">${m.name}</p><p style="font-size:10px;color:var(--text-muted);text-transform:uppercase;">${m.sector}</p></div>
                    </div>
                    <div style="display:flex;gap:6px;">
                        <button class="icon-btn" onclick="toggleAlert(${i})"><i class="fas fa-${a.active?'pause':'play'}"></i></button>
                        <button class="icon-btn danger" onclick="deleteAlert(${i})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
                    <div style="background:rgba(255,255,255,0.03);padding:10px;border-radius:10px;">
                        <p style="font-size:8px;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Condition</p>
                        <p style="font-size:13px;font-weight:700;text-transform:capitalize;">${a.condition}</p>
                    </div>
                    <div style="background:rgba(255,255,255,0.03);padding:10px;border-radius:10px;">
                        <p style="font-size:8px;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Target</p>
                        <p style="font-size:13px;font-weight:700;color:var(--gold);">${formatCurrency(a.price)}</p>
                    </div>
                    <div style="background:rgba(255,255,255,0.03);padding:10px;border-radius:10px;">
                        <p style="font-size:8px;font-weight:800;color:var(--text-muted);text-transform:uppercase;">Current</p>
                        <p style="font-size:13px;font-weight:700;">${formatCurrency(m.ltp)}</p>
                    </div>
                </div>
                <div style="margin-top:12px;display:flex;align-items:center;gap:8px;">
                    <span style="width:8px;height:8px;border-radius:50%;background:${isTriggered?'var(--emerald)':a.active?'var(--gold)':'var(--text-muted)'};${isTriggered||a.active?'animation:pulse-gold 2s infinite;':''}"></span>
                    <span style="font-size:10px;font-weight:700;color:${isTriggered?'var(--emerald)':a.active?'var(--gold)':'var(--text-muted)'};">${isTriggered?'TRIGGERED':a.active?'MONITORING':'PAUSED'}</span>
                </div>
            </div>`;
        }).join('') || '<p style="color:var(--text-muted);font-size:13px;text-align:center;padding:40px;">No alerts yet. Create one to get started.</p>';
    }

    function toggleAlert(i) { state.alerts[i].active = !state.alerts[i].active; saveState(); build(); }
    function deleteAlert(i) { state.alerts.splice(i, 1); saveState(); build(); }

    function saveAlert() {
        let sym = selectedAlertSymbol;
        const rawVal = document.getElementById('alert-symbol').value.toUpperCase().trim();
        
        if (!sym) {
            const found = stockMaster.find(s => s.symbol === rawVal || s.name.toUpperCase() === rawVal);
            if (found) sym = found.symbol;
            else { alert('Please select or type a valid stock symbol.'); return; }
        }
        
        const price = parseFloat(document.getElementById('alert-price').value);
        const condition = document.getElementById('alert-condition').value;
        if (!price) { alert('Please enter a target price.'); return; }
        
        state.alerts.push({ symbol: sym, condition, price, active: true });
        saveState(); closeModal('add-alert-modal'); build();
    }

    // Search
    document.getElementById('alert-symbol').addEventListener('input', e => {
        const v = e.target.value.toUpperCase(), box = document.getElementById('alert-suggestions');
        box.innerHTML = '';
        if (!v) { box.classList.remove('show'); return; }
        const f = stockMaster.filter(s => s.symbol.includes(v) || s.name.toUpperCase().includes(v));
        if (f.length) {
            box.classList.add('show');
            f.forEach(s => {
                const d = document.createElement('div'); d.className = 'suggestion-item';
                d.innerHTML = `<span><strong>${s.symbol}</strong> — ${s.name}</span><span style="font-size:11px;color:var(--text-muted);">${formatCurrency(s.ltp)}</span>`;
                d.onclick = () => { selectedAlertSymbol = s.symbol; e.target.value = s.symbol; box.classList.remove('show'); };
                box.appendChild(d);
            });
        } else box.classList.remove('show');
    });

    initApp(); build();
    </script>
    <style>
        @media (max-width:1024px) { .bento-grid > * { grid-column:span 6!important; } }
        @media (max-width:768px) { 
            .bento-grid { grid-template-columns: repeat(2, 1fr) !important; }
            .bento-grid > * { grid-column:span 2!important; } 
            .bento-grid > .kpi-card { grid-column:span 1!important; }
        }
    </style>
</body>
</html>
